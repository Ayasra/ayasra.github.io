        // --- DOM ELEMENTS ---
        const appContainer = document.getElementById('app-container');

        // --- LOGIC FUNCTIONS ---
        function generateProgram() {
            state.activePresetKey = null;
            const allExercises = exercisesData.filter(ex => ex.muscleGroup !== 'Warm-up').map(ex => ({ id: ex.id, name: ex[state.lang].name, muscleGroup: ex[state.lang].muscleGroup, description: ex[state.lang].description }));
            const muscleGroups = [...new Set(allExercises.map(ex => ex.muscleGroup))];
            let dailyProgram = [];
            const exercisesPerDay = 8;

            for (let i = 0; i < state.days; i++) {
                let dayExercises = [];
                let usedExerciseIdsThisDay = new Set();
                let shuffledGroups = [...muscleGroups].sort(() => 0.5 - Math.random());

                for (const group of shuffledGroups) {
                    const availableInGroup = allExercises.filter(ex => ex.muscleGroup === group && !usedExerciseIdsThisDay.has(ex.id));
                    if (availableInGroup.length > 0) {
                        const randIndex = Math.floor(Math.random() * availableInGroup.length);
                        const selected = availableInGroup[randIndex];
                        dayExercises.push(selected);
                        usedExerciseIdsThisDay.add(selected.id);
                    }
                }

                let remainingPool = allExercises.filter(ex => !usedExerciseIdsThisDay.has(ex.id)).sort(() => 0.5 - Math.random());
                while (dayExercises.length < exercisesPerDay && remainingPool.length > 0) {
                    const selected = remainingPool.pop();
                    dayExercises.push(selected);
                }
                dailyProgram.push(dayExercises);
            }

            state.program = dailyProgram;
            state.completed = {};
            state.expandedId = null;
        }

        function loadPreset(presetKey) {
            state.activePresetKey = presetKey;
            const presetData = presets[presetKey];
            
            const getExerciseById = (id) => {
                const exerciseData = exercisesData.find(ex => ex.id === id);
                return { id: exerciseData.id, name: exerciseData[state.lang].name, muscleGroup: exerciseData[state.lang].muscleGroup, description: exerciseData[state.lang].description };
            };

            if (Array.isArray(presetData[0])) {
                state.program = presetData.map(dayIds => dayIds.map(getExerciseById));
                state.days = presetData.length;
            } else { 
                state.program = [presetData.map(getExerciseById)];
                state.days = 1;
            }

            state.completed = {};
            state.expandedId = null;
            render();
        }

        // --- RENDER FUNCTION ---
        function render() {
            const t = translations[state.lang];
            const isArabic = state.lang === 'ar';
            
            const mainDiv = document.createElement('div');
            mainDiv.dir = isArabic ? 'rtl' : 'ltr';
            mainDiv.className = `min-h-screen text-gray-800 ${isArabic ? 'font-arabic' : 'font-sans'}`;
            
            mainDiv.innerHTML = `
                <div class="container mx-auto p-4 md:p-8">
                    <header class="relative text-center mb-8">
                        <h1 class="text-4xl md:text-5xl font-bold text-gray-900">${t.title}</h1>
                        <p class="text-lg text-gray-600 mt-2">${t.subtitle}</p>
                        <button id="lang-toggle" class="absolute top-0 ${isArabic ? 'left-0' : 'right-0'} bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition">
                            ${t.language}
                        </button>
                    </header>

                    <div class="flex justify-center items-center mb-8 bg-white p-6 rounded-xl shadow-md ${state.activePresetKey ? 'opacity-50' : ''}">
                        <label for="days-select" class="text-lg font-semibold mx-4">${t.daysLabel}</label>
                        <select id="days-select" class="p-3 rounded-lg border-2 border-gray-300 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition" ${state.activePresetKey ? 'disabled' : ''}>
                            <option value="2" ${state.days === 2 ? 'selected' : ''}>2 ${t.daysUnit}</option>
                            <option value="3" ${state.days === 3 ? 'selected' : ''}>3 ${t.daysUnit}</option>
                            <option value="4" ${state.days === 4 ? 'selected' : ''}>4 ${t.daysUnit}</option>
                            <option value="5" ${state.days === 5 ? 'selected' : ''}>5 ${t.daysUnit}</option>
                        </select>
                    </div>

                    <div id="program-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6">
                        ${state.program.map((dayExercises, dayIndex) => {
                            let cardTitle = `${t.day} ${dayIndex + 1}`;
                            if(state.activePresetKey === 'warmUp') cardTitle = t.presetWarmUp;
                            if(state.activePresetKey === 'office') cardTitle = t.presetOffice;
                            if(state.activePresetKey === 'postWorkout') cardTitle = t.presetPostWorkout;
                            if(state.activePresetKey === 'dedicatedBeginner') cardTitle = `${t.presetBeginner} - ${t.day} ${dayIndex + 1}`;
                            if(state.activePresetKey === 'dedicatedIntermediate') cardTitle = `${t.presetIntermediate} - ${t.day} ${dayIndex + 1}`;
                            if(state.activePresetKey === 'dedicatedAdvanced') cardTitle = `${t.presetAdvanced} - ${t.day} ${dayIndex + 1}`;

                            return `
                            <div class="bg-white rounded-xl shadow-lg p-6 flex flex-col">
                                <h2 class="text-xl font-bold mb-4 text-center text-blue-600">${cardTitle}</h2>
                                <ul class="space-y-3 flex-grow">
                                    ${dayExercises.map(exercise => {
                                        const isExpanded = state.expandedId === exercise.id;
                                        const isCompleted = state.completed[exercise.id];
                                        return `
                                            <li class="bg-gray-50 rounded-lg transition-all duration-300 overflow-hidden ${isCompleted ? 'opacity-60' : ''}">
                                                <div class="p-4 flex items-center justify-between cursor-pointer" onclick="toggleExpand('${exercise.id}')">
                                                    <div class="flex items-center min-w-0">
                                                        <div class="flex-shrink-0 h-6 w-6 rounded-full border-2 flex items-center justify-center cursor-pointer ${isArabic ? 'ml-4' : 'mr-4'} border-blue-500" onclick="event.stopPropagation(); toggleComplete('${exercise.id}');">
                                                            ${isCompleted ? '<div class="h-3 w-3 rounded-full bg-green-500"></div>' : ''}
                                                        </div>
                                                        <div class="${isCompleted ? 'line-through' : ''} min-w-0">
                                                            <p class="font-semibold">${exercise.name}</p>
                                                            <p class="text-sm text-gray-500">${exercise.muscleGroup}</p>
                                                        </div>
                                                    </div>
                                                    <svg class="w-5 h-5 text-gray-500 transform transition-transform ${isExpanded ? 'rotate-180' : ''} flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                                </div>
                                                <div class="accordion-content ${isExpanded ? 'expanded' : ''}">
                                                    <div class="px-4 pb-4 pt-2">
                                                        <div class="mt-2 pt-3 border-t border-gray-200">
                                                            <h4 class="font-bold mb-1 text-blue-600">${t.howTo}</h4>
                                                            <p class="text-gray-700 text-sm">${exercise.description}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </li>
                                        `;
                                    }).join('')}
                                </ul>
                            </div>
                        `}).join('')}
                    </div>

                    <div class="text-center mt-12">
                         <button id="generate-btn" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition shadow-lg">
                            ${t.generateButton}
                        </button>
                        <div class="mt-6">
                            <p class="text-gray-600 mb-2">${t.presetTitle}</p>
                            <div class="flex flex-wrap justify-center gap-4">
                                <button id="warm-up-preset-btn" class="bg-yellow-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-yellow-600 transition shadow-md">${t.presetWarmUp}</button>
                                <button id="office-preset-btn" class="bg-teal-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-teal-600 transition shadow-md">${t.presetOffice}</button>
                                <button id="post-workout-preset-btn" class="bg-purple-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-purple-600 transition shadow-md">${t.presetPostWorkout}</button>
                            </div>
                            <div class="mt-4">
                                <p class="text-gray-600 mb-2">- Dedicated 5-Day Programs -</p>
                                <div class="flex flex-wrap justify-center gap-4">
                                    <button id="beginner-preset-btn" class="bg-green-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-green-600 transition shadow-md">${t.presetBeginner}</button>
                                    <button id="intermediate-preset-btn" class="bg-orange-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-orange-600 transition shadow-md">${t.presetIntermediate}</button>
                                    <button id="advanced-preset-btn" class="bg-red-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-600 transition shadow-md">${t.presetAdvanced}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            appContainer.innerHTML = '';
            appContainer.appendChild(mainDiv);

            document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);
            document.getElementById('days-select').addEventListener('change', handleDayChange);
            document.getElementById('generate-btn').addEventListener('click', () => {
                generateProgram();
                render();
            });
            document.getElementById('warm-up-preset-btn').addEventListener('click', () => loadPreset('warmUp'));
            document.getElementById('office-preset-btn').addEventListener('click', () => loadPreset('office'));
            document.getElementById('post-workout-preset-btn').addEventListener('click', () => loadPreset('postWorkout'));
            document.getElementById('beginner-preset-btn').addEventListener('click', () => loadPreset('dedicatedBeginner'));
            document.getElementById('intermediate-preset-btn').addEventListener('click', () => loadPreset('dedicatedIntermediate'));
            document.getElementById('advanced-preset-btn').addEventListener('click', () => loadPreset('dedicatedAdvanced'));
        }

        // --- EVENT HANDLER FUNCTIONS ---
        window.toggleLanguage = () => {
            state.lang = state.lang === 'en' ? 'ar' : 'en';
            if (state.activePresetKey) {
                loadPreset(state.activePresetKey);
            } else {
                generateProgram();
                render();
            }
        };

        window.handleDayChange = (e) => {
            state.days = parseInt(e.target.value);
            generateProgram();
            render();
        };

        window.toggleComplete = (exerciseId) => {
            state.completed[exerciseId] = !state.completed[exerciseId];
            render();
        };
        
        window.toggleExpand = (exerciseId) => {
            state.expandedId = state.expandedId === exerciseId ? null : exerciseId;
            render();
        };


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            generateProgram();
            render();
});

    </script>
</body>
</html>
