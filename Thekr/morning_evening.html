<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار الصباح والمساء</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for beautiful Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom styles to apply the fonts and enhance the design */
        body {
            font-family: 'Noto Naskh Arabic', serif;
            transition: background-color 0.5s ease, color 0.5s ease, background-image 0.5s ease;
            background-size: 100px; /* Size of the repeating pattern tile */
        }
        .dhikr-card {
            font-family: 'Amiri', serif;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .dhikr-card.completed {
            opacity: 0.6;
            transform: scale(0.98);
            cursor: default;
        }
        .counter-text {
            transition: color 0.3s ease, transform 0.3s ease;
            /* The gradient is now applied via Tailwind classes in JS */
        }
        .dhikr-card:not(.completed):hover .counter-text {
            transform: scale(1.1);
        }
        .rtl-text {
            text-align: right;
        }
        /* Removed custom gradient classes as they are now handled by Tailwind utilities */
    </style>
</head>

        const footer = document.getElementById('footer');

        // --- Programmatic SVG Backgrounds ---
        const morningPatternSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><path d="M0 50 L50 100 L100 50 L50 0 Z M50 25 L75 50 L50 75 L25 50Z" stroke="rgba(14, 116, 144, 0.1)" stroke-width="1" fill="none"/><path d="M0 0 L100 100 M100 0 L0 100" stroke="rgba(14, 116, 144, 0.05)" stroke-width="0.5" fill="none"/></svg>`;
        const eveningPatternSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><path d="M0 50 L50 100 L100 50 L50 0 Z M50 25 L75 50 L50 75 L25 50Z" stroke="rgba(207, 250, 254, 0.12)" stroke-width="1" fill="none"/><path d="M0 0 L100 100 M100 0 L0 100" stroke="rgba(207, 250, 254, 0.07)" stroke-width="0.5" fill="none"/></svg>`;
        
        const morningPatternUrl = `url("data:image/svg+xml,${encodeURIComponent(morningPatternSVG)}")`;
        const eveningPatternUrl = `url("data:image/svg+xml,${encodeURIComponent(eveningPatternSVG)}")`;

        let currentMode = 'morning';
        
        // FIX: Store gradient classes in variables for easier management
        const gradientMorningClasses = ['bg-gradient-to-br', 'from-teal-600', 'to-cyan-500', 'bg-clip-text', 'text-transparent'];
        const gradientEveningClasses = ['bg-gradient-to-br', 'from-teal-400', 'to-cyan-400', 'bg-clip-text', 'text-transparent'];
        const gradientCompletedClasses = ['bg-gradient-to-br', 'from-green-500', 'to-emerald-500', 'bg-clip-text', 'text-transparent'];


        /**
         * Renders the Athkar cards based on the selected mode (morning/evening)
         */
        function renderAthkar(mode) {
            container.innerHTML = '';
            const filteredAthkar = athkarData.filter(dhikr => dhikr.type === mode || dhikr.type === 'both');
            
            filteredAthkar.forEach(dhikr => {
                const card = document.createElement('div');
                card.className = 'dhikr-card flex items-center gap-4 bg-white/80 text-gray-900 backdrop-blur-sm rounded-xl shadow-md p-5 cursor-pointer';
                card.dataset.count = dhikr.count;
                card.id = `dhikr-${dhikr.id}`;

                const counterContainer = document.createElement('div');
                counterContainer.className = 'flex-shrink-0';
                const counterText = document.createElement('div');
                counterText.className = 'counter-text text-2xl font-bold w-10 text-center';
                counterText.textContent = dhikr.count;
                counterContainer.appendChild(counterText);

                const separator = document.createElement('div');
                // FIX: Changed separator to a solid black color with opacity for better visibility
                separator.className = 'separator w-px self-stretch bg-black/20 mx-2';

                const textContainer = document.createElement('div');
                textContainer.className = 'flex-grow';
                const textElement = document.createElement('p');
                textElement.className = 'text-xl md:text-2xl leading-loose rtl-text';
                textElement.textContent = dhikr.text;
                textContainer.appendChild(textElement);

                if (dhikr.note) {
                    const noteElement = document.createElement('p');
                    noteElement.className = 'text-sm text-gray-500 mt-3 rtl-text';
                    textContainer.appendChild(noteElement);
                }
                
                // Set gradients based on the current mode using Tailwind utility classes
                if (mode === 'morning') {
                    counterText.classList.add(...gradientMorningClasses);
                } else {
                    counterText.classList.add(...gradientEveningClasses);
                }
                
                card.appendChild(textContainer);
                card.appendChild(separator);
                card.appendChild(counterContainer);
                
                card.addEventListener('click', () => handleCardClick(card));
                container.appendChild(card);
            });
        }

        /**
         * Handles the click event on a dhikr card to update the counter.
         */
        function handleCardClick(card) {
            let currentCount = parseInt(card.dataset.count, 10);
            if (currentCount > 0) {
                currentCount--;
                card.dataset.count = currentCount;
                const counter = card.querySelector('.counter-text');
                counter.textContent = currentCount;
                
                if (currentCount === 0) {
                    card.classList.add('completed');
                    counter.textContent = '✓';
                    // FIX: Change to a green gradient on completion
                    counter.classList.remove(...gradientMorningClasses, ...gradientEveningClasses);
                    counter.classList.add(...gradientCompletedClasses);
                }
            }
        }

        /**
         * Updates the UI to reflect the current mode (morning/evening)
         */
        function setMode(newMode) {
            currentMode = newMode;
            renderAthkar(currentMode);

            if (currentMode === 'morning') {
                morningBtn.classList.add('bg-teal-600', 'text-white');
                morningBtn.classList.remove('bg-white/50', 'text-gray-700');
                eveningBtn.classList.add('bg-white/50', 'text-gray-700');
                eveningBtn.classList.remove('bg-teal-600', 'text-white');

                pageBody.style.backgroundColor = '#f0f9ff';
                pageBody.style.backgroundImage = morningPatternUrl;
                pageBody.classList.remove('text-gray-100');
                pageBody.classList.add('text-gray-800');
                headerTitle.classList.remove('text-teal-200');
                headerTitle.classList.add('text-teal-800');
                footer.classList.remove('text-gray-400');
                footer.classList.add('text-gray-500');

            } else { // evening
                eveningBtn.classList.add('bg-teal-600', 'text-white');
                eveningBtn.classList.remove('bg-white/50', 'text-gray-700');
                morningBtn.classList.add('bg-white/50', 'text-gray-700');
                morningBtn.classList.remove('bg-teal-600', 'text-white');
                
                pageBody.style.backgroundColor = '#1e293b';
                pageBody.style.backgroundImage = eveningPatternUrl;
                pageBody.classList.remove('text-gray-800');
                pageBody.classList.add('text-gray-100');
                headerTitle.classList.remove('text-teal-800');
                headerTitle.classList.add('text-teal-200');
                footer.classList.remove('text-gray-500');
                footer.classList.add('text-gray-400');
            }
        }

        // --- Event Listeners ---
        morningBtn.addEventListener('click', () => setMode('morning'));
        eveningBtn.addEventListener('click', () => setMode('evening'));

        // --- Initial Load ---
        setMode('morning');

    </script>

</body>
</html>
