<link rel="stylesheet" href="assets/thekr.css">
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('thekr.settings.v1') || '{}');
    var h = new Date().getHours();
    var set = (h >= 3 && h < 15) ? 'wake' : 'sleep';
    var theme = (!s.theme || s.theme === 'auto') ? (set === 'wake' ? 'day' : 'night') : s.theme;
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-set', set);
    if (s.size != null) {
      document.documentElement.style.setProperty('--dhikr-size', [1.12,1.28,1.45,1.66,1.92][s.size] + 'rem');
    }
  } catch (e) {}
})();
</script>
</head>
