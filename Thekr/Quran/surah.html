<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القرآن الكريم</title>
<meta name="description" content="قراءة سور القرآن الكريم بالرسم العثماني مع الترجمة والتفسير ومعاني الكلمات والتلاوة.">
<meta name="theme-color" content="#FAF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القرآن">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="stylesheet" href="../assets/thekr.css">
<link rel="stylesheet" href="assets/quran.css">
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('thekr.settings.v1') || '{}');
    var h = new Date().getHours();
    var theme = (!s.theme || s.theme === 'auto') ? ((h >= 5 && h < 18) ? 'day' : 'night') : s.theme;
    document.documentElement.setAttribute('data-theme', theme);
    var q = JSON.parse(localStorage.getItem('quran.settings.v1') || '{}');
    if (q.size != null) document.documentElement.style.setProperty('--ayah-size', [1.35,1.55,1.75,2.0,2.35][q.size] + 'rem');
    document.documentElement.setAttribute('data-mode', q.mode || 'mushaf');
    document.documentElement.setAttribute('data-frame', q.frame === false ? 'off' : 'on');
    document.documentElement.setAttribute('data-pattern', q.pattern === false ? 'off' : 'on');
  } catch (e) {}
})();
</script>
</head>
<body>

<div class="topbar">
  <div class="topbar__inner">
    <a class="iconbtn iconbtn--back" href="index.html" aria-label="رجوع إلى فهرس السور">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>
    </a>
    <div class="progress">
      <div class="progress__row">
        <span class="progress__label" id="page-title">القرآن الكريم</span>
        <span class="progress__count" id="crumb"></span>
      </div>
    </div>
    <button type="button" class="iconbtn" id="gear" aria-expanded="false" aria-controls="settings" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <div class="settings" id="settings" data-open="false">
    <div class="settings__inner"></div>
  </div>

  <div class="state" id="state">
    <div class="spinner" aria-hidden="true"></div>
    <p>جارٍ تحميل السورة…</p>
  </div>

  <main id="main"></main>
</div>

<div class="player" id="player" data-show="false" role="region" aria-label="مشغّل التلاوة">
  <div class="player__inner">
    <button type="button" class="pbtn" id="p-prev" aria-label="الآية السابقة"><svg viewBox="0 0 24 24"><path d="M19 4L9 12l10 8z" fill="currentColor" stroke="none"/><rect x="4.6" y="4" width="2.4" height="16" rx="1" fill="currentColor" stroke="none"/></svg></button>
    <button type="button" class="pbtn pbtn--main" id="p-play" aria-label="تشغيل أو إيقاف"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20" fill="currentColor" stroke="none"/></svg></button>
    <button type="button" class="pbtn" id="p-next" aria-label="الآية التالية"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z" fill="currentColor" stroke="none"/><rect x="17" y="4" width="2.4" height="16" rx="1" fill="currentColor" stroke="none"/></svg></button>
    <span class="player__label" id="player-label"></span>
    <button type="button" class="pbtn" id="p-close" aria-label="إغلاق المشغّل"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
</div>

<!-- verse detail, opened by tapping an ayah medallion -->
<div class="sheet" id="sheet" data-open="false" hidden>
  <div class="sheet__scrim" id="sheet-scrim"></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet__head">
      <span class="sheet__medallion" id="sheet-medallion" aria-hidden="true"></span>
      <span class="sheet__titles">
        <h2 id="sheet-title"></h2>
        <small id="sheet-sub"></small>
      </span>
      <button type="button" class="iconbtn" id="sheet-close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" data-show="false"></div>

<script src="assets/intros.js"></script>
<script src="assets/quran.js"></script>
</body>
</html>
