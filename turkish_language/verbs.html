<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .verb-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .verb-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Flashcard Styles */
        .flashcard-container {
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            height: 250px;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            /* Safari */
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .flashcard-front {
            background-color: white;
        }

        .flashcard-back {
            background-color: #f9fafb;
            /* slightly off-white */
            transform: rotateY(180deg);
        }
    </style>
</head>

                </svg>

        </div>

        <!-- Flashcard Section -->

            <div class="flex justify-center items-center space-x-4 mb-4">
                <div>

                    <button id="mode-english"
                        class="px-4 py-1.5 text-sm font-semibold rounded-md transition bg-white text-gray-700 border">English</button>
                </div>
                <button id="next-card"

                </button>
            </div>

            <div class="flashcard-container">

                        <!-- Content will be injected by JS -->
                    </div>
                    <div id="flashcard-back" class="flashcard-face flashcard-back">
                        <!-- Content will be injected by JS -->
                    </div>
                </div>
            </div>
            <p class="text-center text-gray-500 text-sm mt-3">Click card to flip</p>
        </div>

        <!-- Verbs Grid -->

        </div>
    </div>

                infinitive: 'yakmak', stem: 'yak-', english: 'to burn, to light (transitive)', examples: [
                    { tr: 'Ateş yaktık.', en: 'We lit a fire.' },
                    { tr: 'Yemeği yaktım.', en: 'I burned the food.' },
                    { tr: 'Lütfen ışığı yakar mısın?', en: 'Can you please turn on the light?' },
                    { tr: 'Eski mektupları yaktı.', en: 'He/she burned the old letters.' },
                    { tr: 'Güneş cildimi yaktı.', en: 'The sun burned my skin.' }
                ]
            },
            {
                infinitive: 'yanmak', stem: 'yan-', english: 'to burn (intransitive), to be on fire', examples: [
                    { tr: 'Orman yanıyor.', en: 'The forest is burning.' },
                    { tr: 'Yemek yandı.', en: 'The food is burned.' },
                    { tr: 'Elim yandı.', en: 'My hand got burned.' },
                    { tr: 'Işıklar yanıyor mu?', en: 'Are the lights on?' },
                    { tr: 'Ateş hala yanıyor.', en: 'The fire is still burning.' }
                ]
            },
            {
                infinitive: 'yapılmak', stem: 'yapıl-', english: 'to be done, to be made', examples: [
                    { tr: 'Bu ev ahşaptan yapılmış.', en: 'This house is made of wood.' },
                    { tr: 'Toplantı yarın yapılacak.', en: 'The meeting will be held tomorrow.' },
                    { tr: 'Bu yemek nasıl yapılır?', en: 'How is this dish made?' },
                    { tr: 'Hata yapıldı.', en: 'A mistake was made.' },
                    { tr: 'Tüm işler zamanında yapıldı.', en: 'All the work was done on time.' }
                ]
            },
            {
                infinitive: 'yatmak', stem: 'yat-', english: 'to lie down, to go to bed', examples: [
                    { tr: 'Genellikle saat 11\'de yatarım.', en: 'I usually go to bed at 11.' },
                    { tr: 'Yatağa uzandı ve hemen uyudu.', en: 'He lay down on the bed and fell asleep immediately.' },
                    { tr: 'Hastanede bir hafta yattı.', en: 'He stayed in the hospital for a week.' },
                    { tr: 'Çimlerin üzerine yattı.', en: 'He lay down on the grass.' },
                    { tr: 'Geç yatmak sağlığa zararlıdır.', en: 'Going to bed late is harmful to health.' }
                ]
            },
            {
                infinitive: 'yükselmek', stem: 'yüksel-', english: 'to rise', examples: [
                    { tr: 'Güneş doğudan yükselir.', en: 'The sun rises from the east.' },
                    { tr: 'Fiyatlar hızla yükseliyor.', en: 'Prices are rising rapidly.' },
                    { tr: 'Duman gökyüzüne yükseldi.', en: 'Smoke rose to the sky.' },
                    { tr: 'Kariyerinde hızla yükseldi.', en: 'He rose quickly in his career.' },
                    { tr: 'Sesini yükseltme.', en: 'Don\'t raise your voice.' }
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const verbsContainer = document.getElementById('verbs-container');
            const searchInput = document.getElementById('search-input');
            const noResults = document.getElementById('no-results');

            // --- Flashcard Elements ---
            const flashcard = document.getElementById('flashcard');
            const flashcardFront = document.getElementById('flashcard-front');
            const flashcardBack = document.getElementById('flashcard-back');
            const modeTurkishBtn = document.getElementById('mode-turkish');
            const modeEnglishBtn = document.getElementById('mode-english');
            const nextCardBtn = document.getElementById('next-card');

            // --- Flashcard State ---
            let currentVerb = null;
            let currentMode = 'turkish'; // 'turkish' or 'english'

            // --- Flashcard Functions ---
            const getRandomVerb = () => {
                const randomIndex = Math.floor(Math.random() * verbs.length);
                return verbs[randomIndex];
            };

            const updateFlashcard = () => {
                if (!currentVerb) return;

                // Pick a random example for the flashcard
                const randomExample = currentVerb.examples[Math.floor(Math.random() * currentVerb.examples.length)];

                flashcard.classList.remove('is-flipped');

                // Using a small timeout to allow the card to flip back before changing content
                setTimeout(() => {
                    if (currentMode === 'turkish') {
                        flashcardFront.innerHTML = `<h3 class="text-4xl font-bold text-blue-600">${currentVerb.infinitive}</h3>`;
                        flashcardBack.innerHTML = `
                            <h3 class="text-3xl font-bold text-gray-800">${currentVerb.english}</h3>
                            <p class="text-lg text-gray-600 mt-2">(Stem: ${currentVerb.stem})</p>
                            <div class="text-center bg-white p-3 rounded-md mt-4 w-full max-w-sm">
                                <p class="text-md text-gray-800 italic">"${randomExample.tr}"</p>
                                <p class="text-sm text-gray-500 mt-1">"${randomExample.en}"</p>
                            </div>
                        `;
                    } else { // English mode
                        flashcardFront.innerHTML = `<h3 class="text-4xl font-bold text-blue-600">${currentVerb.english}</h3>`;
                        flashcardBack.innerHTML = `
                            <h3 class="text-3xl font-bold text-gray-800">${currentVerb.infinitive}</h3>
                            <p class="text-lg text-gray-600 mt-2">(Stem: ${currentVerb.stem})</p>
                            <div class="text-center bg-white p-3 rounded-md mt-4 w-full max-w-sm">
                                <p class="text-md text-gray-800 italic">"${randomExample.tr}"</p>
                                <p class="text-sm text-gray-500 mt-1">"${randomExample.en}"</p>
                            </div>
                        `;
                    }
                }, 150);
            };

            const showNextCard = () => {
                currentVerb = getRandomVerb();
                updateFlashcard();
            };

            // --- Event Listeners for Flashcard ---
            flashcard.addEventListener('click', () => {
                flashcard.classList.toggle('is-flipped');
            });

            nextCardBtn.addEventListener('click', showNextCard);

            modeTurkishBtn.addEventListener('click', () => {
                currentMode = 'turkish';
                modeTurkishBtn.classList.add('bg-blue-600', 'text-white');
                modeTurkishBtn.classList.remove('bg-white', 'text-gray-700', 'border');
                modeEnglishBtn.classList.add('bg-white', 'text-gray-700', 'border');
                modeEnglishBtn.classList.remove('bg-blue-600', 'text-white');
                updateFlashcard();
            });

            modeEnglishBtn.addEventListener('click', () => {
                currentMode = 'english';
                modeEnglishBtn.classList.add('bg-blue-600', 'text-white');
                modeEnglishBtn.classList.remove('bg-white', 'text-gray-700', 'border');
                modeTurkishBtn.classList.add('bg-white', 'text-gray-700', 'border');
                modeTurkishBtn.classList.remove('bg-blue-600', 'text-white');
                updateFlashcard();
            });


            // --- Verb List Functions ---
            const renderVerbs = (verbList) => {
                verbsContainer.innerHTML = ''; // Clear existing content

                if (verbList.length === 0) {
                    noResults.classList.remove('hidden');
                } else {
                    noResults.classList.add('hidden');
                }

                verbList.forEach(verb => {
                    const card = document.createElement('div');
                    card.className = 'verb-card bg-white p-5 rounded-lg shadow-md border border-gray-200 flex flex-col';

                    const examplesHtml = verb.examples.map(ex => `
                        <li class="mt-2">
                            <p class="text-md text-gray-800 italic">"${ex.tr}"</p>
                            <p class="text-sm text-gray-500">"${ex.en}"</p>
                        </li>
                    `).join('');

                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="text-2xl font-bold text-blue-600">${verb.infinitive}</h2>
                                <span class="text-sm font-medium bg-blue-100 text-blue-700 px-2 py-1 rounded-full">${verb.stem}</span>
                            </div>
                            <p class="text-lg text-gray-700 font-medium mb-4">${verb.english}</p>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-md mt-auto">
                            <h4 class="font-semibold text-gray-700 mb-1">Examples:</h4>
                            <ul class="list-disc list-inside space-y-1 text-left">
                                ${examplesHtml}
                            </ul>
                        </div>
                    `;
                    verbsContainer.appendChild(card);
                });
            };

            // --- Initial Render ---
            const sortedVerbs = verbs.sort((a, b) => a.infinitive.localeCompare(b.infinitive));
            renderVerbs(sortedVerbs);
            showNextCard(); // Show the first flashcard on load

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                const filteredVerbs = sortedVerbs.filter(verb =>
                    verb.infinitive.toLowerCase().includes(searchTerm) ||
                    verb.english.toLowerCase().includes(searchTerm) ||
                    verb.stem.toLowerCase().includes(searchTerm)
                );
                renderVerbs(filteredVerbs);
            });
        });

    </script>
</body>

</html>
