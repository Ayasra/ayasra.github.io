<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Pro Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- History Panel -->
        <aside class="history-panel">
            <div class="history-panel-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> History</h2>
            </div>
            <button id="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <ul id="history-list">
                <!-- History items will be dynamically inserted here -->
            </ul>
        </aside>

        <!-- Main Chat Panel -->
        <main class="chat-panel">
            <div class="chat-panel-header">
                <button id="history-toggle-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="model-selector-container">
                    <i class="fa-solid fa-brain"></i>
                    <select id="model-selector">
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    </select>
                </div>
            </div>
            <div id="chat-log">
                <div class="message model-message">
                    <p>Hello! How can I help you today? Select a model and press Shift+Enter to send your message.</p>
                </div>
            </div>
            <div class="chat-input-area">
                <div id="file-preview-container"></div>
                <div class="input-wrapper">
                    <label for="file-input" class="file-input-label">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="file-input" multiple hidden>
                    <textarea id="user-input" placeholder="Ask Gemini anything, or attach a file..." rows="1"></textarea>
                    <button id="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay collapsed">
        <div class="modal-content">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete this chat? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button id="cancel-delete-btn" class="modal-btn cancel-btn">Cancel</button>
                <button id="confirm-delete-btn" class="modal-btn confirm-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Markdown Parser Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
